[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "synkinema"
dynamic = ["version"]
description = "Local-first, agent-native media composition engine"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.10,<3", "sqlalchemy>=2,<3", "alembic>=1.14,<2", "python-multipart>=0.0.20", "mcp>=1.12,<2", "pillow>=11", "numpy>=2", "httpx>=0.28"]
[project.optional-dependencies]
speech = ["supertonic==1.3.1", "faster-whisper==1.2.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff==0.16.7"]
[project.scripts]
synkinema = "synkinema.cli:main"
[tool.setuptools.packages.find]
where = ["apps/server"]
[tool.setuptools.dynamic]
version = {attr = "synkinema.__version__"}
[tool.pytest.ini_options]
pythonpath = ["apps/server"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110

[tool.setuptools.package-data]
synkinema = ["agent_guide.md", "supertonic_model.json"]
