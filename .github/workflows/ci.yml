name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: Verify code and API contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/studio/package-lock.json
      - name: Install FFmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
          npm ci --ignore-scripts
          npm --prefix apps/studio ci
      - name: Validate workflow syntax
        run: npm run workflows:check
      - name: Format, release rules, API drift and Python tests
        run: make format-check lint test-tools api-check test-python PYTHON=python RUFF=ruff
  studio:
    name: Studio tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm --prefix apps/studio ci
      - run: npm --prefix apps/studio test
      - run: npm --prefix apps/studio run build
  docker:
    name: Container (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            cache: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            cache: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the release layout with a test version
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: synkinema:ci
          build-args: |
            APP_VERSION=0.0.0
            VCS_REF=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=ci-${{ matrix.cache }}
          cache-to: type=gha,mode=min,scope=ci-${{ matrix.cache }},ignore-error=true,timeout=2m
      - name: Real render, inspection and MCP smoke test as non-root
        run: >-
          docker run --rm -e SYNKINEMA_EXPECT_VERSION=0.0.0
          -v "$PWD/scripts:/smoke:ro" --entrypoint python
          synkinema:ci /smoke/container_smoke.py
      - name: Test the actual HTTP server and bundled Studio
        run: |
          docker run -d --name synkinema-ci -p 127.0.0.1:18080:8080 -e SYNKINEMA_ALLOWED_HOSTS=studio.test synkinema:ci
          python3 scripts/http_smoke.py --url http://127.0.0.1:18080 --version 0.0.0 --trusted-host studio.test
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Compile the host launcher and test it with the real container
        run: |
          python -m pip install -r requirements-local.txt
          python scripts/build_local_helper.py --version 0.0.0
          if [[ "$(uname -m)" == "aarch64" ]]; then arch=arm64; else arch=x64; fi
          python scripts/smoke_local_helper.py synkinema:ci --helper "dist/local-helper/synkinema-local-linux-$arch"
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs synkinema-ci 2>/dev/null || true
          docker rm --force --volumes synkinema-ci 2>/dev/null || true
  release-plan:
    name: Plan semantic release
    needs: [verify, studio, docker, local-helper]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      github.event.repository.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Plan the next semantic release
        id: plan
        run: npm run release:plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether the planned release metadata is ready to publish
        id: ready
        if: steps.plan.outputs.version != ''
        run: SYNKINEMA_RELEASE_PLAN="${{ steps.plan.outputs.plan }}" npm run release:ready
  local-helper:
    name: Verify local agent launcher
    uses: ./.github/workflows/local-helper.yml
    with:
      ref: ${{ github.sha }}
  release-pr:
    name: Prepare release pull request
    needs: release-plan
    if: >-
      needs.release-plan.outputs.version != '' &&
      needs.release-plan.outputs.ready != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/studio/package-lock.json
      - name: Install release metadata tooling
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-build-isolation --no-deps -e .
          npm ci --ignore-scripts
          npm --prefix apps/studio ci
      - name: Plan the next semantic release
        id: plan
        run: npm run release:plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write release metadata and generated API contract
        if: steps.plan.outputs.version != ''
        run: |
          SYNKINEMA_RELEASE_PLAN="${{ steps.plan.outputs.plan }}" npm run release:prepare-pr
          npm --prefix apps/studio run api:generate
      - name: Create or update the release pull request
        id: release_pr
        if: steps.plan.outputs.version != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: chore/release
          delete-branch: true
          commit-message: "chore(release): v${{ steps.plan.outputs.version }}"
          title: "chore(release): v${{ steps.plan.outputs.version }}"
          body: |
            Generated from the Conventional Commits currently on `main`.

            This PR updates `CHANGELOG.md`, both application package manifests and
            lockfiles, the Python server version, Docker defaults and generated API
            metadata. Required checks gate its automatic squash merge; the merge
            publishes the already planned semantic release.
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          add-paths: |
            CHANGELOG.md
            Dockerfile
            package.json
            package-lock.json
            apps/studio/package.json
            apps/studio/package-lock.json
            apps/server/synkinema/__init__.py
            apps/studio/src/api/generated/client.ts
            apps/studio/src/api/generated/openapi.json
      - name: Run CI against the release pull request branch
        if: steps.release_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref chore/release
      - name: Check the generated pull request title
        if: steps.release_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ steps.release_pr.outputs.pull-request-number }}
        run: gh workflow run pr-title.yml --ref chore/release -f pull_request_number="$RELEASE_PR_NUMBER"
      - name: Queue automatic squash merge after required checks
        if: steps.release_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ steps.release_pr.outputs.pull-request-number }}
        run: |
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .allow_auto_merge)" != "true" ]]; then
            echo "::warning::Repository auto-merge is unavailable; merge the release PR after checks pass."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" > "$RUNNER_TEMP/main-rules.json"
          if ! node scripts/release/assert-merge-guards.mjs "$RUNNER_TEMP/main-rules.json"; then
            echo "::warning::Main lacks the required release rules; merge the release PR manually after checks pass."
            exit 0
          fi
          gh pr merge "$RELEASE_PR_NUMBER" --auto --squash --delete-branch
  release:
    name: Semantic release
    needs: release-plan
    if: >-
      needs.release-plan.outputs.version != '' &&
      needs.release-plan.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Publish tag and generated GitHub release notes
        id: release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish:
    name: Publish release image
    needs: release
    if: needs.release.outputs.version != ''
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release.outputs.version }}
      ref: ${{ github.sha }}
