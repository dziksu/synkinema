name: Release container
# Called directly: GITHUB_TOKEN-created tags do not trigger a separate push run.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      ref:
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: release-container
  cancel-in-progress: false
jobs:
  image:
    name: Publish GHCR (amd64 and arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify release identity and choose image tags
        id: identity
        run: node scripts/release/image-tags.mjs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the tested commit
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.identity.outputs.tags }}
          build-args: |
            APP_VERSION=${{ inputs.version }}
            VCS_REF=${{ inputs.ref }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          sbom: true
          provenance: mode=max
      - name: Record published image digest
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Published `%s:v%s`\n\nDigest: `%s`\n' "$IMAGE" "$VERSION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
