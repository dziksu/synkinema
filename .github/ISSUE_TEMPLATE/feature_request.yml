name: Feature request
description: Propose an improvement to Synkinema
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What task is difficult or missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Explain the manual editing flow and agent/API use where relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and examples
