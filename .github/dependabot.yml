version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(deps-dev)
    groups:
      release-toolchain:
        patterns: ['*']
        update-types: [minor, patch]
      release-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # Preset 10 requires a newer changelog writer; update the toolchain together.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /apps/studio
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      studio:
        patterns: ['*']
        update-types: [minor, patch]
      studio-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # Compiler and OpenAPI generator majors require source and contract migrations.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: swagger-typescript-api
        update-types: [version-update:semver-major]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 2
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      python:
        patterns: ['*']
        update-types: [minor, patch]
      python-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # PyAV 19 removes metadata_errors used by pinned faster-whisper 1.2.1.
      - dependency-name: av
        update-types: [version-update:semver-major]
      # Archived provider/model adapter is upgraded only after an explicit review.
      - dependency-name: supertonic
      # MCP 2 changes the server contract and requires a deliberate migration.
      - dependency-name: mcp
        update-types: [version-update:semver-major]
      # tokenizers 0.23 requires huggingface-hub < 2; migrate speech together.
      - dependency-name: huggingface-hub
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 1
    commit-message:
      prefix: build(deps)
    groups:
      containers:
        patterns: ['*']
      containers-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # Runtime majors must move with .nvmrc/.python-version and both smoke tests.
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: python
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
