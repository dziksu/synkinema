version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: build(deps-dev)
    groups:
      release-toolchain:
        patterns: ['semantic-release', '@semantic-release/*', 'conventional-changelog-*']
    ignore:
      # Preset 10 requires a newer changelog writer; update the toolchain together.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /apps/studio
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
      tanstack:
        patterns: ['@tanstack/*']
      i18n:
        patterns: [i18next, react-i18next]
      build-tools:
        patterns: ['vite', 'vitest', '@vitejs/plugin-react', '@tailwindcss/vite']
    ignore:
      # Compiler and OpenAPI generator majors require source and contract migrations.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: swagger-typescript-api
        update-types: [version-update:semver-major]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      api:
        patterns: [fastapi, starlette, pydantic, pydantic-core, mcp]
      speech:
        patterns: [supertonic, onnxruntime, numpy, soundfile, huggingface-hub]
    ignore:
      # Archived provider/model adapter is upgraded only after an explicit review.
      - dependency-name: supertonic
      # MCP 2 changes the server contract and requires a deliberate migration.
      - dependency-name: mcp
        update-types: [version-update:semver-major]
      # tokenizers 0.23 requires huggingface-hub < 2; migrate speech together.
      - dependency-name: huggingface-hub
        update-types: [version-update:semver-major]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
    ignore:
      # Runtime majors must move with .nvmrc/.python-version and both smoke tests.
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: python
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(deps)
